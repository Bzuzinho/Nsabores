name: Oracle production image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: oracle-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/oracle/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            PREVIEW_HOST=www.nsabores.pt
          tags: ghcr.io/bzuzinho/nsabores:sha-${{ github.sha }}
          provenance: false
