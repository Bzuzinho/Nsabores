name: Format customer separation once

on:
  push:
    branches:
      - feature/separate-customers-users

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/separate-customers-users
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            apps/api/src/auth/account.service.ts \
            apps/api/src/auth/admin-users.controller.ts \
            apps/api/src/auth/admin-users.service.ts \
            apps/api/src/commerce/commerce.service.ts \
            apps/api/src/customers/customers.controller.ts \
            apps/api/src/customers/customers.service.ts \
            apps/management/components/customers-admin.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/auth/account.service.ts apps/api/src/auth/admin-users.controller.ts apps/api/src/auth/admin-users.service.ts apps/api/src/commerce/commerce.service.ts apps/api/src/customers/customers.controller.ts apps/api/src/customers/customers.service.ts apps/management/components/customers-admin.tsx
          git commit -m "Aplicar formatação à separação Clientes Utilizadores"
          git push origin HEAD:feature/separate-customers-users
