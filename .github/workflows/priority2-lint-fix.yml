name: Priority 2 lint fix

on:
  push:
    branches:
      - chore/priority-2-quality

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/priority-2-quality
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nsabores/api prisma:generate
      - run: pnpm --filter @nsabores/api exec eslint "src/**/*.ts" --fix || true
      - run: pnpm format
      - name: Commit fixes
        run: |
          if [ -z "$(git status --short)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style(lint): aplicar correções automáticas da API"
          git push origin HEAD:chore/priority-2-quality
