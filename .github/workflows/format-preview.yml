name: Format preview

on:
  push:
    branches:
      - fix/delivery-readiness-audit-2026-09-28

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show Prettier diff
        run: |
          pnpm exec prettier --write             apps/api/src/auth/dto.ts             apps/management/components/catalog-admin.tsx             apps/management/components/customers-admin.tsx
          git diff --             apps/api/src/auth/dto.ts             apps/management/components/catalog-admin.tsx             apps/management/components/customers-admin.tsx
