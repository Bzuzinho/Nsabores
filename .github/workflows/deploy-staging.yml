name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      service:
        description: Railway service to deploy
        required: true
        type: choice
        options:
          - website
          - management
          - api

permissions:
  contents: read

env:
  RAILWAY_ENVIRONMENT: staging

jobs:
  deploy:
    name: Deploy ${{ inputs.service }} to staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Railway token
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN is not configured in the staging environment."
            exit 1
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy selected service
        run: railway up --service "${{ inputs.service }}" --environment "${RAILWAY_ENVIRONMENT}" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deployment summary
        run: |
          echo "### Railway staging deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: ${{ inputs.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${RAILWAY_ENVIRONMENT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
