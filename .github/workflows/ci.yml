name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          LOG="$RUNNER_TEMP/quality.log"
          : > "$LOG"

          run_gate() {
            echo "\n===== $1 =====" | tee -a "$LOG"
            shift
            "$@" 2>&1 | tee -a "$LOG"
            return ${PIPESTATUS[0]}
          }

          failed=0
          run_gate "Prisma generate" pnpm --filter @nsabores/api prisma:generate || failed=1
          run_gate "Normalize formatting" pnpm format || failed=1
          run_gate "Verify formatting" pnpm format:check || failed=1
          run_gate "Lint" pnpm lint || failed=1
          run_gate "Typecheck" pnpm typecheck || failed=1
          run_gate "Tests" pnpm test || failed=1
          run_gate "Build" pnpm build || failed=1

          if [ "$failed" -ne 0 ]; then
            tail -n 500 "$LOG" > "$RUNNER_TEMP/quality-tail.log"
            body=$(cat <<EOF
          Automated CI diagnostic for commit \`${GITHUB_SHA}\`.

          <details><summary>Quality checks log (last 500 lines)</summary>

          \`\`\`
          $(cat "$RUNNER_TEMP/quality-tail.log")
          \`\`\`
          </details>
          EOF
          )
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'CI diagnostics in:title' --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "CI diagnostics" --body "$body"
            fi
            exit 1
          fi

  migrations:
    name: Clean database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nsabores

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nsabores
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nsabores"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate clean PostgreSQL lifecycle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          LOG="$RUNNER_TEMP/migrations.log"
          : > "$LOG"

          run_gate() {
            echo "\n===== $1 =====" | tee -a "$LOG"
            shift
            "$@" 2>&1 | tee -a "$LOG"
            return ${PIPESTATUS[0]}
          }

          failed=0
          run_gate "Build types package" pnpm --filter @nsabores/types build || failed=1
          run_gate "Build validation package" pnpm --filter @nsabores/validation build || failed=1
          run_gate "Prisma generate" pnpm --filter @nsabores/api prisma:generate || failed=1
          run_gate "Apply migrations" pnpm --filter @nsabores/api prisma:migrate:deploy || failed=1
          run_gate "Migration status" pnpm --filter @nsabores/api exec prisma migrate status || failed=1
          run_gate "Seed" pnpm --filter @nsabores/api prisma:seed || failed=1
          run_gate "Club lifecycle" pnpm --filter @nsabores/api validate:club || failed=1
          run_gate "Loyalty and gift cards" pnpm --filter @nsabores/api validate:loyalty || failed=1
          run_gate "Full loyalty checkout" pnpm --filter @nsabores/api validate:loyalty-checkout || failed=1

          if [ "$failed" -ne 0 ]; then
            tail -n 500 "$LOG" > "$RUNNER_TEMP/migrations-tail.log"
            body=$(cat <<EOF
          Automated migration diagnostic for commit \`${GITHUB_SHA}\`.

          <details><summary>Migration/smoke log (last 500 lines)</summary>

          \`\`\`
          $(cat "$RUNNER_TEMP/migrations-tail.log")
          \`\`\`
          </details>
          EOF
          )
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'CI diagnostics in:title' --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "CI diagnostics" --body "$body"
            fi
            exit 1
          fi
