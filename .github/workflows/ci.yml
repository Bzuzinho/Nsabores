name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify checked out commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --short

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @nsabores/api prisma:generate

      - name: Normalize formatting in runner
        run: pnpm format

      - name: Verify formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Clean build artifacts
        shell: bash
        run: rm -rf .turbo apps/website/.next apps/management/.next apps/api/dist

      - name: Build
        run: pnpm build

  migrations:
    name: Clean database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nsabores
      AUTH_ACCESS_TOKEN_SECRET: ci-access-token-secret-with-at-least-32-characters
      PAYMENT_PROVIDER: mock
      PAYMENT_FLOW_MODE: manual

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nsabores
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nsabores"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1

      - name: Verify checked out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build internal packages
        run: |
          pnpm --filter @nsabores/types build
          pnpm --filter @nsabores/validation build

      - name: Generate Prisma client
        run: pnpm --filter @nsabores/api prisma:generate

      - name: Apply migrations
        run: pnpm --filter @nsabores/api prisma:migrate:deploy

      - name: Confirm migration status
        run: pnpm --filter @nsabores/api exec prisma migrate status

      - name: Seed clean database
        run: pnpm --filter @nsabores/api prisma:seed

      - name: Validate Club lifecycle
        run: pnpm --filter @nsabores/api validate:club

      - name: Validate manual Club payments
        run: pnpm --filter @nsabores/api validate:club-manual

      - name: Validate loyalty and gift cards
        run: pnpm --filter @nsabores/api validate:loyalty

      - name: Validate manual checkout lifecycle
        run: pnpm --filter @nsabores/api validate:loyalty-checkout

      - name: Validate Sprint 10 acceptance
        run: pnpm --filter @nsabores/api validate:sprint10

      - name: Validate fiscal issuance lifecycle
        run: pnpm --filter @nsabores/api validate:fiscal

      - name: Validate gift card and Club fiscal documents
        run: pnpm --filter @nsabores/api validate:fiscal-sources

      - name: Validate fiscal provider lifecycle
        run: pnpm --filter @nsabores/api validate:fiscal-provider

      - name: Validate fiscal reconciliation reports
        run: pnpm --filter @nsabores/api validate:fiscal-reconciliation
