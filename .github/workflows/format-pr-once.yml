name: Format PR source once

on:
  push:
    branches:
      - fix/oracle-production-brand-media-20261124
    paths:
      - .github/workflows/format-pr-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oracle-production-brand-media-20261124
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/management/components/catalog-admin.tsx
      - name: Push formatting fix
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/management/components/catalog-admin.tsx
            git commit -m "style(management): normalize product image UI formatting"
            git push origin HEAD:fix/oracle-production-brand-media-20261124
          fi
